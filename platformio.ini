; PlatformIO Project Configuration File
; Cydintosh - Mac Plus emulator for ESP32 display boards

[platformio]
default_envs = esp32-cyd2usb

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
framework = espidf
board_build.partitions = partitions.csv
build_flags =
    -Iinclude
    -DUSE_INTERNAL_RAM
    -DENABLE_DASM=0

[env:esp32-cyd2usb]
board = esp32dev
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
lib_ignore =
    m5stack_tab5
    espressif__esp_lcd_ili9881c
    espressif__esp_lcd_st7703
    espressif__esp_lcd_touch_gt911
    espressif__esp_lcd_touch_st7123
    espressif__esp_codec_dev
    espressif__usb_host_hid
build_flags =
    ${env.build_flags}
    -DMUSASHI_CNF=\"m68kconf.h\"
    -DCYD_MACHINE_MAC_PLUS=1
    -DUMAC_MEMSIZE=128
    -DDISP_WIDTH=240
    -DDISP_HEIGHT=320
    -DCYD_BOARD_ESP32_2432S028=1

[env:esp32-cyd2usb-mac512x384-rotfit]
board = esp32dev
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
lib_ignore =
    m5stack_tab5
    espressif__esp_lcd_ili9881c
    espressif__esp_lcd_st7703
    espressif__esp_lcd_touch_gt911
    espressif__esp_lcd_touch_st7123
    espressif__esp_codec_dev
    espressif__usb_host_hid
build_flags =
    ${env.build_flags}
    -DMUSASHI_CNF=\"m68kconf.h\"
    -DCYD_MACHINE_MAC_PLUS=1
    -DUMAC_MEMSIZE=128
    -DDISP_WIDTH=512
    -DDISP_HEIGHT=384
    -DCYD_BOARD_ESP32_2432S028_MAC512X384_ROTFIT=1

; Backward-compatible alias for older docs/scripts.
[env:esp32dev]
extends = env:esp32-cyd2usb

[env:esp32-8048s043c]
board = 4d_systems_esp32s3_gen4_r8n16
board_build.flash_mode = dio
board_build.partitions = partitions-16mb.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
upload_speed = 460800
lib_ignore =
    m5stack_tab5
    espressif__esp_lcd_ili9881c
    espressif__esp_lcd_st7703
    espressif__esp_lcd_touch_gt911
    espressif__esp_lcd_touch_st7123
    espressif__esp_codec_dev
    espressif__usb_host_hid
build_flags =
    ${env.build_flags}
    -DMUSASHI_CNF=\"m68kconf.h\"
    -DCYD_MACHINE_MAC_PLUS=1
    -DUMAC_MEMSIZE=1024
    -DDISP_WIDTH=480
    -DDISP_HEIGHT=800
    -DCYD_BOARD_ESP32_8048S043C=1
    -DBOARD_HAS_PSRAM

[env:esp32-p4-tab5-lc-color]
; Connected Tab5 reports ESP32-P4 rev v1.3. Use PlatformIO's M5Stack Tab5
; ES/pre-rev300 board definition so linker scripts and CPU frequency match this
; physical unit. The rev3 generic board emits code/linker layouts that trap with
; Illegal instruction on this hardware.
board = m5stack-tab5-p4
board_build.flash_mode = qio
board_build.partitions = partitions-esp32p4-tab5-lc.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32p4
    -DCYD_MACHINE_MAC_LC=ON
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:D1:46:0D-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:D1:46:0D-if00
upload_speed = 921600
monitor_speed = 115200
lib_ignore = lcd_cyd
build_flags =
    ${env.build_flags}
    -DMUSASHI_CNF=\"m68kconf_lc.h\"
    -DCYD_MACHINE_MAC_LC=1
    -DCYD_BOARD_M5STACK_TAB5_ESP32P4_LC=1
    -DLC_ROM_EXPECTED_SIZE=0x80000
    -DLC_ROM_EXPECTED_FIRST_LONG=0x350EACF0

[env:esp32-p4-tab5-display-smoke]
; Hardware display smoke test using the vendored M5Tab5-UserDemo BSP component.
; No LC emulation runs: it initializes SYS-I2C/PI4IOE, detects the panel path,
; initializes MIPI-DSI, draws a physical 720x1280 RGB565 pattern, then pulses
; brightness. Use this before attempting LC framebuffer output.
board = m5stack-tab5-p4
board_build.flash_mode = qio
board_build.partitions = partitions-esp32p4-tab5-lc.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32p4
    -DCYD_MACHINE_MAC_LC=ON
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:D1:46:0D-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:D1:46:0D-if00
upload_speed = 921600
monitor_speed = 115200
lib_ignore = lcd_cyd
build_flags =
    ${env.build_flags}
    -DMUSASHI_CNF=\"m68kconf_lc.h\"
    -DCYD_MACHINE_MAC_LC=1
    -DCYD_BOARD_M5STACK_TAB5_ESP32P4_LC=1
    -DLC_ROM_EXPECTED_SIZE=0x80000
    -DLC_ROM_EXPECTED_FIRST_LONG=0x350EACF0
    -DTAB5_LC_DISPLAY_SMOKE_ONLY=1

[env:esp32-p4-tab5-bootdiag]
; Minimal Tab5/P4 diagnostic image: no PSRAM boot init and no LC probes. It
; loops forever toggling GPIO22 high/low and writing direct USB-Serial/JTAG text.
; Use only while isolating app boot/backlight visibility.
board = m5stack-tab5-p4
board_build.flash_mode = qio
board_build.partitions = partitions-esp32p4-tab5-lc.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32p4.bootdiag
    -DCYD_MACHINE_MAC_LC=ON
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:D1:46:0D-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:D1:46:0D-if00
upload_speed = 921600
monitor_speed = 115200
lib_ignore = lcd_cyd
build_flags =
    ${env.build_flags}
    -DMUSASHI_CNF=\"m68kconf_lc.h\"
    -DCYD_MACHINE_MAC_LC=1
    -DCYD_BOARD_M5STACK_TAB5_ESP32P4_LC=1
    -DLC_ROM_EXPECTED_SIZE=0x80000
    -DLC_ROM_EXPECTED_FIRST_LONG=0x350EACF0
    -DTAB5_LC_BOOT_DIAG_ONLY=1
